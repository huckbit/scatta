<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scatta settings</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #1f1f1f;
      --muted: #5f6368;
      --line: #dadce0;
      --accent: #1a73e8;
      --ok: #188038;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --line: #3c4043;
        --accent: #8ab4f8;
        --ok: #81c995;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      max-width: 480px;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    .row small { display: block; color: var(--muted); }
    label.row { cursor: pointer; }
    .row.disabled { opacity: 0.55; }

    .toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .track {
      position: relative;
      flex: none;
      width: 34px;
      height: 20px;
      border-radius: 10px;
      background: var(--line);
      transition: background 0.15s;
    }
    .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s;
    }
    .toggle input:checked + .track { background: var(--accent); }
    .toggle input:checked + .track::after { transform: translateX(14px); }
    .toggle input:focus-visible + .track, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .track, .track::after { transition: none; } }

    select {
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }

    #saved { min-height: 18px; margin: 10px 0 0; font-size: 12px; color: var(--ok); }

    footer {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Scatta settings</h1>

  <label class="row">
    <span>
      Main button
      <small>Highlighted in the popup, so Enter takes this one</small>
    </span>
    <select id="default-mode">
      <option value="visible">Visible area</option>
      <option value="full">Full page</option>
    </select>
  </label>

  <label class="row toggle">
    <span>
      Close after the screenshot
      <small>Closes the popup once the image is copied or saved. Stays open if there's a warning or an error.</small>
    </span>
    <input type="checkbox" id="auto-close">
    <span class="track" aria-hidden="true"></span>
  </label>

  <label class="row" id="delay-row">
    <span>
      Close after
      <small>How long to show the result first</small>
    </span>
    <select id="auto-close-delay">
      <option value="1">1 second</option>
      <option value="2">2 seconds</option>
      <option value="3">3 seconds</option>
      <option value="5">5 seconds</option>
    </select>
  </label>

  <p id="saved" role="status" aria-live="polite"></p>

  <footer>
    Found a bug or have an idea?
    <a href="https://github.com/huckbit/scatta/issues" target="_blank" rel="noopener">Open an issue on GitHub</a>
  </footer>

  <script src="options.js"></script>
</body>
</html>
