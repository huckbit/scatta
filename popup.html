<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scatta</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #1f1f1f;
      --muted: #5f6368;
      --line: #dadce0;
      --hover: #f1f3f4;
      --accent: #1a73e8;
      --accent-text: #ffffff;
      --ok: #188038;
      --warn: #b06000;
      --error: #c5221f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --line: #3c4043;
        --hover: #2d2e31;
        --accent: #8ab4f8;
        --accent-text: #202124;
        --ok: #81c995;
        --warn: #fdd663;
        --error: #f28b82;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 280px;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
    h1 { margin: 0; font-size: 15px; font-weight: 600; }
    #settings {
      display: flex;
      padding: 4px;
      border-radius: 6px;
      color: var(--muted);
    }
    #settings:hover { background: var(--hover); color: var(--text); }
    #settings:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn {
      display: block;
      width: 100%;
      margin: 0 0 8px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .btn small { display: block; margin-top: 2px; font-weight: 400; color: var(--muted); }
    .btn:hover { background: var(--hover); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .btn.primary small { color: inherit; opacity: 0.85; }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn:focus-visible, .toggle input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn:disabled { opacity: 0.55; cursor: wait; }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0 0;
      padding: 10px 0 0;
      border-top: 1px solid var(--line);
      cursor: pointer;
    }
    .toggle .label small { display: block; color: var(--muted); }
    .toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .track {
      position: relative;
      flex: none;
      width: 34px;
      height: 20px;
      border-radius: 10px;
      background: var(--line);
      transition: background 0.15s;
    }
    .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s;
    }
    .toggle input:checked + .track { background: var(--accent); }
    .toggle input:checked + .track::after { transform: translateX(14px); }
    @media (prefers-reduced-motion: reduce) { .track, .track::after { transition: none; } }

    #status { min-height: 18px; margin: 10px 0 0; font-size: 12px; color: var(--muted); }
    #status.ok { color: var(--ok); font-weight: 600; }
    #status.warn { color: var(--warn); }
    #status.error { color: var(--error); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>Scatta</h1>
    <a id="settings" href="options.html" target="_blank" title="Settings" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </a>
  </header>

  <button id="visible" class="btn primary" autofocus>
    <span class="action">Copy</span> visible area
    <small>Just what is on your screen</small>
  </button>
  <button id="full" class="btn">
    <span class="action">Copy</span> full page
    <small>The whole page, top to bottom</small>
  </button>

  <label class="toggle">
    <span class="label">
      Save as file
      <small id="toggle-hint">Off: copies to the clipboard</small>
    </span>
    <input type="checkbox" id="save-file">
    <span class="track" aria-hidden="true"></span>
  </label>

  <p id="status" role="status" aria-live="polite"></p>

  <script src="popup.js"></script>
</body>
</html>
